<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- DeepSeek 办公助手 应用图标
       设计：DeepSeek 蓝渐变圆角方块 × Office 文档页 × 助手星标 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B7CFA"/>
      <stop offset="1" stop-color="#3F5EE8"/>
    </linearGradient>
  </defs>

  <!-- 背景：圆角方块 -->
  <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#bg)"/>

  <!-- 文档页 -->
  <rect x="21" y="12" width="38" height="56" rx="5" fill="#ffffff"/>

  <!-- 折角 -->
  <path d="M50 12 L59 12 L59 21 Z" fill="#C9D8F9"/>
  <path d="M50 12 L59 21" stroke="#A9BFF0" stroke-width="2" fill="none"/>

  <!-- 文本行 -->
  <rect x="27" y="29" width="18" height="6" rx="3" fill="#DCE5FB"/>
  <rect x="27" y="39" width="18" height="6" rx="3" fill="#DCE5FB"/>
  <rect x="27" y="53" width="26" height="6" rx="3" fill="#DCE5FB"/>

  <!-- 助手星标（四角星） -->
  <path d="M48 27.5 L50 32.5 L55 34.5 L50 36.5 L48 41.5 L46 36.5 L41 34.5 L46 32.5 Z" fill="#2F4FD8"/>
</svg>
